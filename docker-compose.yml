services:
  postgres:
    image: postgres:16-alpine
    container_name: sgpb-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: abadeus
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: sgpb_db
    volumes:
      - sgpb_pgdata:/var/lib/postgresql/data

volumes:
  sgpb_pgdata:
